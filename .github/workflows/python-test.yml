name: Python Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.11", tox_env: py311-django52-wagtail70 }
          - { python: "3.12", tox_env: py312-django52-wagtail70 }
          - { python: "3.13", tox_env: py313-django52-wagtail70 }
          - { python: "3.14", tox_env: py314-django52-wagtail70 }
          - { python: "3.12", tox_env: py312-django52-wagtail80 }
          - { python: "3.12", tox_env: py312-django60-wagtail80 }
          - { python: "3.13", tox_env: py313-django52-wagtail80 }
          - { python: "3.13", tox_env: py313-django60-wagtail80 }
          - { python: "3.14", tox_env: py314-django52-wagtail80 }
          - { python: "3.14", tox_env: py314-django60-wagtail80 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}

      - name: Test with tox
        run: uvx --with tox-uv tox -e "$TOX_ENV"
        env:
          TOX_ENV: ${{ matrix.tox_env }}

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Check formatting and lint
        run: |
          uv run --frozen ruff format --check src tests sandbox
          uv run --frozen ruff check src tests sandbox

  release:
    runs-on: ubuntu-latest
    needs: [test, format]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      # Creates or updates the release PR, or creates the GitHub release once
      # it is merged. The release is created with the app token, so it triggers
      # python-release.yml, which publishes to PyPI.
      - name: Prepare release
        id: changie
        uses: labd/changie-release-action@059406879b04f6e073547b325fbbff9a573038e3 # v2.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          # uv.lock contains the project version as well
          version-command: uv lock
          create-release: true
