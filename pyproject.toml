[project]
name = "wagtail-2fa"
version = "1.8.0"
description = "Two factor authentication for Wagtail"
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lab Digital", email = "opensource@labdigital.nl" }]
requires-python = ">=3.11"
dependencies = [
    "Django>=5.2",
    "Wagtail>=7.0",
    "django-otp>=1.7.0",
    "qrcode>=6.1",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Wagtail",
    "Framework :: Wagtail :: 7",
    "Framework :: Wagtail :: 8",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/labd/wagtail-2fa"
Documentation = "https://wagtail-2fa.readthedocs.io/"
Changelog = "https://github.com/labd/wagtail-2fa/blob/master/CHANGES"

[dependency-groups]
dev = [
    "coverage[toml]>=7",
    "pytest>=8",
    "pytest-cov>=6",
    "pytest-django>=4.11",
    "ruff>=0.17.2",
    "tox>=4.26",
    "tox-uv>=1.28",
]
docs = [
    "sphinx>=1.4.1",
    "sphinx_rtd_theme>=0.4.3",
]
sandbox = [
    "django-debug-toolbar",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wagtail_2fa"]

[tool.hatch.build.targets.sdist]
include = [
    "src/wagtail_2fa",
    "CHANGES",
    "LICENSE",
    "README.rst",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["wagtail_2fa"]

[tool.coverage.paths]
source = [
    "src/wagtail_2fa",
    ".tox/*/lib/python*/site-packages/wagtail_2fa",
]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 88
extend-exclude = ["**/migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["wagtail_2fa"]
