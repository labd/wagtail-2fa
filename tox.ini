[tox]
requires =
    tox>=4.26
    tox-uv>=1.28
envlist =
    py{311,312,313,314}-django52-wagtail70
    py{312,313,314}-django{52,60}-wagtail80
    format

[testenv]
dependency_groups = dev
deps =
    django52: Django>=5.2,<6.0
    django60: Django>=6.0,<6.1
    wagtail70: wagtail>=7.0,<7.1
    wagtail80: wagtail>=8.0,<8.1
commands = coverage run --parallel -m pytest {posargs} -vvv

[testenv:format]
dependency_groups = dev
skip_install = true
deps =
commands =
    ruff format --check src tests sandbox
    ruff check src tests sandbox

[testenv:coverage-report]
dependency_groups = dev
skip_install = true
deps =
commands =
    coverage combine
    coverage report
